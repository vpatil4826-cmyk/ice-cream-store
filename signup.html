<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Hub Signup</title>
    <link rel="stylesheet" href="./signup.css">
</head>
<body>
    <header class="auth-navbar">
        <div class="brand">
            <span class="brand-mark">IC</span>
            <span>Ice Cream Hub</span>
        </div>

        <nav class="nav-links" aria-label="Main navigation">
            <a href="./Index.html">Home</a>
            <a href="./Index.html#about">About</a>
            <a href="./Index.html#services">Services</a>
            <a href="./Index.html#contact">Contact</a>
        </nav>

        <div class="nav-actions">
            <a href="./LOGIN.HTML" class="btn light">Login</a>
            <a href="./signup.html" class="btn dark">Signup</a>
        </div>
    </header>

    <main class="auth-main">
        <section class="auth-panel">
            <div class="brand-panel">
                <span class="panel-badge">Freshly made</span>
                <h1>Join the sweetest club.</h1>
                <p>Create your account for custom flavors, party orders, and premium scoops delivered with love.</p>

                <div class="mini-gallery">
                    <div class="mini-card one"><img src="./images/Chocolate Ice Cream.avif" alt="Chocolate ice cream"></div>
                    <div class="mini-card two"><img src="./images/Strawberry Ice Cream.avif" alt="Strawberry ice cream"></div>
                    <div class="mini-card three"><img src="./images/Vanilla Ice Cream.avif" alt="Vanilla ice cream"></div>
                </div>
            </div>

            <div class="auth-card">
                <h2>Create Account</h2>

                <form class="form-box">
                    <input type="text" placeholder="Enter Full Name" aria-label="Full name">
                    <input type="email" placeholder="Enter Your Email" aria-label="Email address">
                    <input type="password" placeholder="Create Password" aria-label="Create password">
                    <input type="password" placeholder="Confirm Password" aria-label="Confirm password">
                    <button type="submit">Signup</button>
                </form>

                <p>
                    Already have an account?
                    <a href="./LOGIN.HTML">Login</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
